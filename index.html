<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>생명 오락실</title>
  <meta name="description" content="2000년대 피처폰·스마트폰·PC 명작을 오마주한 중2~통합과학1 생명과학 미니게임 모음">
  <meta name="theme-color" content="#1b1530">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="생명 오락실">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="shared/arcade.css">
  <style>
    body { display: block; }
    .hub { max-width: 520px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px 40px; color: #fff; }
    .marquee { text-align: center; padding: 18px 10px 14px; border-radius: 20px; background: linear-gradient(180deg, #3b2a6b, #231a45); border: 3px solid #f2c14e; box-shadow: 0 0 0 4px #231a45, 0 0 24px rgba(242, 193, 78, .35); }
    .marquee small { letter-spacing: .25em; color: #f2c14e; font-weight: 800; font-size: 12px; }
    .marquee h1 { margin: 4px 0 4px; font-size: clamp(32px, 10vw, 44px); letter-spacing: -.02em; text-shadow: 3px 3px 0 #e2574c; }
    .marquee p { margin: 0; color: #d9d1f2; font-size: 14px; }
    .who { display: flex; gap: 8px; margin: 14px 0 6px; }
    .who input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 10px; border: 2px solid #4a3d7a; background: #2b2150; color: #fff; }
    .who input::placeholder { color: #9b90c4; }
    .cabinets { display: grid; gap: 12px; margin-top: 12px; }
    .cab { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); background: var(--panel); border-radius: 16px; padding: 12px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); border: 3px solid transparent; }
    .cab:hover, .cab:focus-visible { border-color: #f2c14e; outline: none; }
    .cab .screen { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 26px; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2); }
    .cab h2 { margin: 0; font-size: 18px; }
    .cab .hom { font-size: 12px; color: var(--ink-2); font-weight: 700; }
    .cab .pitch { font-size: 13px; margin: 3px 0; line-height: 1.4; word-break: keep-all; }
    .cab .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; }
    .cab .meta .code { background: #efe6fb; color: #5b3f94; border-radius: 999px; padding: 1px 7px; font-weight: 700; }
    .cab .meta .stars { font-size: 14px; margin-left: auto; }
    .panel-dark { margin-top: 18px; background: #2b2150; border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.5; }
    .panel-dark h3 { margin: 0 0 6px; font-size: 15px; color: #f2c14e; }
    .panel-dark textarea { background: #fff; }
    .panel-dark .btn { margin-top: 6px; }
    .foot { color: #9b90c4; font-size: 12px; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="hub">
    <header class="marquee">
      <small>INSERT COIN · 중2 ~ 통합과학1</small>
      <h1>생명 오락실</h1>
      <p>그 시절 명작 게임의 손맛으로 배우는 생명과학</p>
    </header>

    <div class="who">
      <input id="sid" placeholder="학번" maxlength="12" autocomplete="off" aria-label="학번">
      <input id="sname" placeholder="이름" maxlength="20" autocomplete="off" aria-label="이름">
    </div>

    <nav class="cabinets" id="cabinets" aria-label="게임 목록"></nav>

    <section class="panel-dark">
      <h3>내 기록 · 제출</h3>
      <textarea id="summary" readonly aria-label="기록 요약"></textarea>
      <button class="btn primary" id="copy">요약 복사</button>
      <button class="btn" id="dl">JSON 저장</button>
      <span id="msg"></span>
    </section>

    <section class="panel-dark">
      <h3>휴대폰·태블릿에 설치하기</h3>
      <p>아이폰·아이패드: 사파리의 <b>공유 → 홈 화면에 추가</b><br>안드로이드: 크롬 메뉴의 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b><br>설치하면 인터넷이 끊겨도 실행됩니다.</p>
    </section>

    <p class="foot">모든 게임은 원작의 이름·캐릭터·그림을 쓰지 않고 구조와 조작감만 빌린 오마주입니다. 성취기준·성취수준: 2022 개정 과학과 교육과정(교육부 고시 제2022-33호 별책9)과 교육부·평가원 성취수준. 기록은 이 기기에만 저장됩니다.</p>
  </main>

  <script src="shared/standards.js"></script>
  <script src="shared/arcade.js"></script>
  <script>
    (function () {
      const A = window.Arcade, $ = id => document.getElementById(id);
      const box = $('cabinets');
      box.innerHTML = A.GAMES.map(g => `<a class="cab" href="${g.path}">
        <div class="screen" style="background:${g.color}">${g.title[0]}</div>
        <div><span class="hom">${g.genre} · ${g.homage}</span><h2>${g.title}</h2>
          <p class="pitch">${g.pitch}</p>
          <div class="meta">${g.standards.map(c => `<span class="code">${c}</span>`).join('')}${A.stars(A.best(g.id))}</div></div></a>`).join('');

      const st = A.student();
      $('sid').value = st.id || ''; $('sname').value = st.name || '';
      const sync = () => { A.setStudent({ id: $('sid').value.trim(), name: $('sname').value.trim() }); render(); };
      $('sid').oninput = sync; $('sname').oninput = sync;

      function summary() {
        const d = A.data(), s = d.student || {};
        const lines = [`[생명 오락실] ${s.id || ''} ${s.name || ''}`.trim()];
        A.GAMES.forEach(g => {
          if (g.id === 'quest') { const b = A.best('quest'); if (b) lines.push(`${g.title}: 체육관 평균 ★${b} (세부 기록은 게임 안 메뉴)`); return; }
          const r = d.games[g.id]; if (!r) return;
          const last = r.plays[r.plays.length - 1];
          lines.push(`${g.title} [${g.standards[0]}]: 최고 ★${r.best}, ${r.plays.length}판${last.reflection ? ` / 설명: ${last.reflection}` : ''}`);
        });
        return lines.join('\n');
      }
      function render() { $('summary').value = summary(); }
      render();
      $('copy').onclick = async () => { try { await navigator.clipboard.writeText(summary()); $('msg').textContent = ' 복사했습니다.'; } catch { $('msg').textContent = ' 글상자를 길게 눌러 복사하세요.'; } };
      $('dl').onclick = () => {
        let quest = null; try { quest = JSON.parse(localStorage.getItem('bioQuest.v1')); } catch {}
        const blob = new Blob([JSON.stringify({ app: 'bio-arcade', exportedAt: new Date().toISOString(), ...A.data(), quest }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `생명오락실_${A.student().id || 'noid'}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    })();
  </script>
</body>
</html>
