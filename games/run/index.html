<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>에너지 런</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <style>
    body { background: #2b1a1a; }
    #cv { aspect-ratio: 4 / 3; }
    .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; background: var(--panel); border-radius: 14px; padding: 8px 10px; margin-top: 8px; font-size: 12px; font-weight: 700; }
    .gauge .bar2 { height: 10px; background: #eadfca; border-radius: 6px; overflow: hidden; margin-top: 2px; }
    .gauge .bar2 i { display: block; height: 100%; transition: width .15s; }
    .gauge.energy { grid-column: 1 / -1; }
    .gauge.energy .bar2 { height: 14px; }
    .eq { grid-column: 1 / -1; text-align: center; font-size: 13px; background: #f3ecdc; border-radius: 8px; padding: 4px; }
    .eq.off { color: #c0392b; }
    .zone { color: #fff; text-align: center; font-size: 14px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <header class="bar"><a href="../../index.html">← 오락실</a><b>에너지 런</b><div class="hud"><span id="dist">0 m</span><span id="time">60초</span></div></header>
  <main id="stage">
    <canvas id="cv" class="game" width="480" height="360" aria-label="달리기 화면. 누르면 점프"></canvas>
    <p class="zone" id="zone"></p>
    <div class="gauges">
      <div class="gauge energy">에너지(ATP) <span id="e-v"></span><div class="bar2"><i id="e-b" style="background:#e2574c"></i></div></div>
      <div class="gauge">영양소(포도당) <span id="n-v"></span><div class="bar2"><i id="n-b" style="background:#e0a412"></i></div></div>
      <div class="gauge">산소 <span id="o-v"></span><div class="bar2"><i id="o-b" style="background:#3d85c6"></i></div></div>
      <div class="gauge">이산화 탄소 <span id="c-v"></span><div class="bar2"><i id="c-b" style="background:#7f7f7f"></i></div></div>
      <div class="gauge">요소(노폐물) <span id="u-v"></span><div class="bar2"><i id="u-b" style="background:#8e7cc3"></i></div></div>
      <div class="eq" id="eq">포도당 + 산소 → 에너지 + 이산화 탄소 + 물</div>
    </div>
    <div class="toast" id="toast"></div>
  </main>
  <div class="overlay" id="overlay" hidden></div>
  <script src="../../shared/standards.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="game.js"></script>
</body>
</html>
