<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>가계도 지뢰찾기</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <style>
    /* 시각 원칙 제안 값, 혈액 순환 적용 결과로 바뀔 수 있음 */
    :root {
      --bg:#e8f2e8; --panel:#fffdf5; --board:#f7fbf1; --ink:#203d39;
      --muted:#536760; --ink-2:var(--muted); --line:#bbcbbb; --line-strong:#47645a;
      --accent:#246844; --accent-ink:#fffdf5; --outline:#35504a;
      --disabled:#dce5d9; --selected:#e5f5ea; --proof-bg:#dceff0; --proof:#276b86;
      --affected:#222; --normal:#fff; --ok:#1f8a4c; --bad:#c0392b; --missed:#976016;
      --gold:#976016; --wrong-bg:#fbe6e3; --overlay-bg:#203d39b8; --toast-bg:#203d39ed;
      --font-title:24px; --font-body:15px; --font-small:12px; --font-input:16px;
      --font-number:22px; --font-svg-label:13px; --font-svg-question:18px; --font-svg-reference-label:16px;
      --radius-button:10px; --radius-panel:12px; --radius-board:16px; --radius-hud:5px;
      --shadow-button:0 3px 0 #3c674520; --shadow-none:none; --sw:2.3;
    }
    body, #overlay .card { word-break:keep-all; overflow-wrap:break-word; font-size:var(--font-body); }
    .btn, .face, .card-btn { font-size:var(--font-body); font-weight:650; min-height:44px;
      background:var(--panel); color:var(--ink); border-color:var(--line-strong);
      border-radius:var(--radius-button); box-shadow:var(--shadow-button); }
    .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    .btn:disabled, .face:disabled { opacity:1; background:var(--disabled); color:var(--ink); cursor:default; }
    .btn.right { background:var(--selected); border-color:var(--ok); }
    .btn.wrong { background:var(--wrong-bg); border-color:var(--bad); }
    .btn.big { font-size:var(--font-body); }
    .bar { color:var(--ink); gap:6px; padding:0 6px; }
    .bar a { color:var(--ink); background:var(--panel); font-size:var(--font-body); padding:4px 6px; border-radius:var(--radius-button); }
    .bar b { font-size:var(--font-body); }
    .bar .hud span { padding:3px; font-size:var(--font-small); background:var(--panel); border-radius:var(--radius-hud); }
    #stage { padding:0 6px max(4px, env(safe-area-inset-bottom)); }
    #chooser { padding:18px 8px; }
    #chooser h1, #challenge-intro h2, .card h2 { font-size:var(--font-title); }
    #chooser h1 { margin:8px 0 18px; }
    .choice { margin-bottom:22px; }
    .choice .btn { width:100%; min-height:48px; }
    .choice p { font-size:var(--font-body); line-height:1.5; margin:6px 2px; }
    #challenge-intro { padding:16px 10px; line-height:1.65; }
    #challenge-intro li { margin-bottom:12px; }
    #problem { display:flex; flex-direction:column; padding-bottom:4px; }
    #problem[hidden] { display:none; }
    .problem-heading { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px; margin:2px; }
    .lvl { margin:0; font-size:var(--font-body); line-height:1.2; font-weight:650; }
    .playhud { color:var(--muted); font-size:var(--font-small); margin:0; line-height:1.2; }
    .practice { font-size:var(--font-small); margin:0 2px 2px; color:var(--ink); }
    .board { background:var(--panel); border:2px solid var(--outline); border-radius:var(--radius-board); padding:2px; }
    .status { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:0 4px 2px; }
    .lcd { background:var(--ink); color:var(--panel); font-family:ui-monospace, Menlo, Consolas, monospace;
      font-size:var(--font-number); font-weight:750; padding:3px 6px; border-radius:var(--radius-hud);
      min-width:66px; text-align:center; letter-spacing:2px; }
    .face { min-width:110px; padding:2px 8px; border:2px solid var(--outline); line-height:1.1; }
    .face small { display:block; font-size:var(--font-small); font-weight:400; }
    .field { background:var(--normal); border:1px solid var(--line-strong); }
    .field svg { width:100%; display:block; }
    .family-line { fill:none; stroke:var(--outline); stroke-width:var(--sw); }
    .person-number { fill:var(--ink); pointer-events:none; }
    .carrier-fill { fill:var(--accent); pointer-events:none; }
    .field .person { cursor:pointer; }
    .field .person:focus-visible .touch-target { stroke:var(--proof); stroke-width:2; stroke-dasharray:3 2; }
    .verdict { pointer-events:none; }
    /* □ ○ ◐ ?는 학습 표기 기호이며 아이콘이 아니므로 그대로 둔다. */
    .legend { font-size:var(--font-small); line-height:1.4; margin:4px 2px; color:var(--muted); }
    .legend .carrier-key { color:var(--accent); }
    .clues { padding:2px 3px; border-bottom:1px solid var(--outline); font-size:var(--font-body); line-height:1.2; }
    .clues h2 { font-size:var(--font-body); margin:0; }
    .conditions { list-style:none; padding:0; margin:0; }
    .card-btn { display:block; width:100%; margin:1px 0; padding:2px 4px; border:1px solid var(--line-strong);
      line-height:1.2; text-align:left; box-shadow:var(--shadow-none); }
    .card-btn.active { background:var(--proof-bg); outline:2px solid var(--proof); outline-offset:-2px; }
    table { width:100%; border-collapse:collapse; margin:2px 0 0; font-size:var(--font-body); background:var(--panel); }
    th, td { border:1px solid var(--line-strong); text-align:left; padding:2px 4px; font-weight:400; }
    th { width:40%; }
    .mode-picker[hidden] { display:none; }
    .mode-buttons { display:flex; gap:4px; }
    .mode-buttons .btn { flex:1; min-width:44px; white-space:nowrap; padding:4px 2px; line-height:1.2; }
    .mode-buttons [aria-pressed="true"] { background:var(--selected); color:var(--ink); border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-3px; }
    #facts { margin:0; line-height:1.5; font-size:var(--font-body); }
    #facts summary { cursor:pointer; min-height:44px; display:flex; align-items:center; text-decoration:underline; }
    #facts li { margin:6px 0; }
    .solution { padding:9px 6px; background:var(--proof-bg); border-bottom:2px solid var(--proof); font-size:var(--font-body); line-height:1.5; }
    .solution p { margin:0 0 8px; }
    .step-nav { display:flex; align-items:center; justify-content:space-between; gap:3px; }
    .step-nav .btn { padding:6px; }
    .step-nav span { font-size:var(--font-small); }
    #actions { margin-top:4px; padding:3px 0 max(3px, env(safe-area-inset-bottom)); background:var(--bg); }
    #actions:not(.judged) { position:sticky; bottom:0; z-index:4; }
    #more-clues { font-size:var(--font-small); line-height:1.4; margin:0 2px 3px; color:var(--ink); }
    .action-row { display:flex; align-items:stretch; gap:4px; }
    .action-row .mode-picker { flex:2; min-width:0; }
    #judge { flex:1; width:auto; min-width:44px; margin:0; min-height:44px; padding:4px 2px; white-space:nowrap; }
    .action-row .mode-buttons, .action-row .mode-buttons .btn { height:100%; }
    .result { background:var(--panel); border-radius:var(--radius-panel); padding:10px; margin-top:10px; font-size:var(--font-body); line-height:1.5; }
    .result p { margin:4px 0; }
    .result ul { padding-left:20px; }
    .result li { margin-bottom:4px; }
    .mode-reason { border-bottom:1px solid var(--line); padding-bottom:8px; }
    .pedigree-reference { margin:8px 0; padding:8px; background:var(--normal); border:1px solid var(--line-strong); border-radius:var(--radius-panel); }
    .pedigree-reference figcaption { font-size:var(--font-body); margin-bottom:4px; }
    .pedigree-reference .conditions, .reference-card { font-size:var(--font-body); line-height:1.5; }
    .reference-card { margin:4px 0; }
    .pedigree-reference .person-number { font-size:var(--font-svg-reference-label); }
    .pedigree-reference svg { display:block; width:100%; max-width:320px; margin:auto; }
    #overlay .card { border-radius:var(--radius-panel); box-shadow:var(--shadow-none); }
    #overlay { background:var(--overlay-bg); }
    #overlay .rules, #overlay .quiz-fb, #overlay .refl { font-size:var(--font-body) !important; }
    #overlay .best, #overlay .note, #overlay .homage { font-size:var(--font-small) !important; }
    #overlay textarea { font-size:var(--font-input); border-radius:var(--radius-button); background:var(--normal); }
    #overlay .quiz, #overlay details.std { background:var(--board); border-radius:var(--radius-panel); }
    .toast { font-size:var(--font-body); background:var(--toast-bg); color:var(--accent-ink); border-radius:var(--radius-panel); overflow-wrap:break-word; }
  </style>
</head>
<body>
  <header class="bar"><a href="../../index.html" data-art="교체 예정">← 오락실</a><b>가계도 지뢰찾기</b><div class="hud"><span id="stagehud"></span></div></header>
  <main id="stage" data-avoid="">
    <section id="chooser" hidden aria-labelledby="choose-title">
      <h1 id="choose-title">판 고르기</h1>
      <div class="choice"><button class="btn" id="choose-basic">기본 판</button><p>고정 4문제에서 부모와 자녀의 형질을 이어 본다.</p></div>
      <div class="choice"><button class="btn" id="choose-1">도전 1 · 단서 조합</button><p>가계도와 자료를 조합한다. 판마다 새 문제 4개가 나온다.</p></div>
      <div class="choice"><button class="btn" id="choose-2" disabled aria-describedby="unlock-note">도전 2 · 유전 방식 추리</button><p id="unlock-note"></p></div>
    </section>
    <section id="challenge-intro" hidden></section>
    <section id="problem" hidden>
      <div class="problem-heading"><p class="lvl" id="lvl"></p><p class="playhud" id="playhud"></p></div>
      <p class="practice" id="practice" hidden>연습용 고정 문제 · 최고 기록 갱신 대상에서 제외한다.</p>
      <div class="board">
        <div class="status"><span class="lcd" id="mines" role="status" aria-atomic="true">000</span><button class="face" id="face" title="표시 지우기" aria-label="표시 지우기">표시 지우기</button><span class="lcd" id="timer" aria-label="지난 시간, 초">000</span></div>
        <div class="field" id="field"></div>
      </div>
      <section class="solution" id="solution" hidden aria-label="한 줄씩 풀이">
        <p id="step-text" aria-live="polite"></p>
        <div class="step-nav"><button class="btn" id="prev-step" data-art="교체 예정">◀ 이전</button><span id="step-count"></span><button class="btn" id="next-step" data-art="교체 예정">다음 ▶</button></div>
      </section>
      <section class="clues" id="clues" aria-label="자료"></section>
      <details id="facts" hidden></details>
      <p class="legend">□ 남성 ○ 여성 · 검게 칠함 = 형질 발현<br>눌러서 표시: <b class="carrier-key">◐ 보인자</b> → <b>? 모름</b> → 표시 없음<br>반드시 보인자인 사람만 표시한다. 보인자일 수도 있는 사람은 ?로 남긴다.</p>
      <div id="result"></div>
      <div id="actions">
        <p id="more-clues" hidden role="status"></p>
        <div class="action-row">
          <section class="mode-picker" id="mode-picker" hidden aria-label="유전 방식 고르기">
            <div class="mode-buttons"><button class="btn" data-mode="auto" aria-label="상염색체 유전 고르기" aria-pressed="false">상염색체</button><button class="btn" data-mode="x" aria-label="X 염색체 유전 고르기" aria-pressed="false">X 염색체</button></div>
          </section>
          <button class="btn primary big judge" id="judge">판정하기</button>
        </div>
      </div>
    </section>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <div class="overlay" id="overlay" hidden></div>
  <script src="../../shared/standards.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="pedigree.js"></script>
  <script src="game.js"></script>
</body>
</html>
