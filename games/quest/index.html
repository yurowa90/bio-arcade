<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>생명 탐사대</title>
  <meta name="description" content="학교와 둘레를 걸으며 생물을 관찰하고 광합성·소화 체육관에 도전하는 생명과학 게임">
  <meta name="theme-color" content="#e8f2e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="생명 탐사대">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 공용 기호 파일과 연결할 때 이 묶음만 교체한다. -->
  <svg class="q-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="q-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
<symbol id="q-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></symbol>
<symbol id="q-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
<symbol id="q-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
<symbol id="q-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
<symbol id="q-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="q-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="q-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
<symbol id="q-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="q-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9Z"/></symbol>
<symbol id="q-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></symbol>
  </defs></svg>
  <main id="device">
    <!-- 화면 영역: 지도 캔버스 + 겹쳐 뜨는 창들 -->
    <section id="screen">
      <canvas id="map" width="176" height="144" aria-label="탐사 지도"></canvas>
      <div id="map-tools" hidden><button id="minimap-toggle" class="btn small" aria-label="미니맵 펼치기" aria-expanded="false" aria-controls="minimap"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-map"/></svg><span>지도</span></button><canvas id="minimap" width="190" height="125" aria-label="전체 미니맵과 주인공 위치" hidden></canvas></div>
      <div id="hud"><span id="hud-place"></span><span id="hud-time"></span></div>

      <!-- 타이틀 -->
      <div id="title" class="layer">
        <div class="title-card">
          <p class="title-sub">신항고 생태 도감</p>
          <h1>생명 탐사대</h1>
          <p class="title-desc">학교와 둘레를 걸으며 생물을 관찰하고<br>광합성·소화 체육관에 도전하세요</p>
          <button id="btn-new" class="btn primary">처음부터</button>
          <button id="btn-continue" class="btn" hidden>이어하기</button>
          <a class="btn" id="btn-hub" href="../../index.html"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-left"/></svg> 오락실로</a>
          <p class="title-note">중2 ~ 통합과학1 생명과학</p>
        </div>
      </div>

      <!-- 대화창 -->
      <div id="dialog" class="dialog" hidden>
        <div id="dialog-name" class="dialog-name"></div>
        <div id="dialog-text" class="dialog-text"></div>
        <div id="dialog-choices" class="dialog-choices"></div>
        <div id="dialog-next" class="dialog-next" aria-hidden="true"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-down"/></svg></div>
      </div>

      <!-- 전체 화면 창(도감·조우·대결·메뉴) -->
      <div id="panel" class="layer panel" hidden>
        <div class="panel-head"><b id="panel-title"></b><button id="panel-close" class="btn small" aria-label="닫기"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-close"/></svg></button></div>
        <div id="panel-body" class="panel-body"></div>
      </div>
    </section>

    <!-- 조작부 -->
    <section id="pad" aria-label="조작 버튼">
      <div class="dpad">
        <button class="dir up" data-dir="up" aria-label="위"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-up"/></svg></button>
        <button class="dir left" data-dir="left" aria-label="왼쪽"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-left"/></svg></button>
        <button class="dir right" data-dir="right" aria-label="오른쪽"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-right"/></svg></button>
        <button class="dir down" data-dir="down" aria-label="아래"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#q-down"/></svg></button>
      </div>
      <div class="ab">
        <button id="btn-b" class="round b" aria-label="메뉴">메뉴</button>
        <button id="btn-a" class="round a" aria-label="확인">확인</button>
      </div>
    </section>
  </main>

  <script src="js/mapdata.js"></script>
  <script src="js/data.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/maprender.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
