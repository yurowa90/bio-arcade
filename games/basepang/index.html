<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>염기쌍 팡</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../icons/icon-180.png">
  <link rel="stylesheet" href="../../shared/arcade.css">
  <style>
    body { background: linear-gradient(180deg, #ffb3c1, #ffd6a5); }
    .bar, .bar a { color: #3a1c2b; }
    .bar a, .bar .hud span { background: rgba(255, 255, 255, .5); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-shrink: 0; line-height: 1.2; }
    .scorebox { background: #fff; border-radius: 14px; padding: 6px 12px; font-weight: 900; font-size: 22px; color: #c2185b; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
    .movebox { background: #fff; border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(6, var(--tile-size, 44px)); grid-template-rows: repeat(8, var(--tile-size, 44px)); gap: 3px; background: rgba(255, 255, 255, .55); padding: 6px; border-radius: 18px; touch-action: none; position: relative; flex-shrink: 0; }
    .tile { min-width: 0; min-height: 0; padding: 0; border: none; font-size: clamp(20px, 7vw, 30px); line-height: 1; font-weight: 900; color: #fff; display: grid; place-items: center; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2); transition: transform .12s; position: relative; }
    .tile.D { border-radius: 10px; }
    .tile.R { border-radius: 50%; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), 0 0 0 3px #fff inset; }
    .tile.R::after { content: 'RNA'; position: absolute; bottom: 2px; font-size: 8px; font-weight: 800; opacity: .9; }
    .tile.sel { transform: scale(1.1); outline: 4px solid #fff; }
    .tile:focus-visible { outline: 3px dashed #3a1c2b; outline-offset: 2px; }
    .tile.pop { animation: pop .35s ease-out; }
    @keyframes pop { 50% { transform: scale(1.3); filter: brightness(1.5); } }
    .b-A { background: #e06666; } .b-T { background: #e0a412; } .b-G { background: #6aa84f; } .b-C { background: #3d85c6; } .b-U { background: #8e7cc3; }
    #stage { min-height: 0; }
    .bar { flex-shrink: 0; }
    .legend-slot { position: relative; height: 44px; margin-bottom: 4px; flex-shrink: 0; }
    .legend { display: flex; align-items: center; justify-content: space-between; height: 100%; background: rgba(255, 255, 255, .7); border-radius: 12px; font-size: 12px; line-height: 1.5; }
    .legend-key { padding-left: 8px; white-space: nowrap; }
    .legend-details summary { display: flex; align-items: center; justify-content: center; width: 44px; min-height: 44px; cursor: pointer; font-weight: 800; }
    .legend-body { position: absolute; top: 44px; left: 0; width: 100%; max-height: min(60vh, 400px); overflow: auto; padding: 10px; background: #fffaf0; border: 2px solid #3a1c2b; border-radius: 12px; font-size: 13px; z-index: 10; }
    .legend-body ol { margin: 8px 0; padding-left: 22px; }
    /* 토스트는 범례 자리만 쓴다. 첫 줄 타일과 설명 접기 버튼은 가리지 않는다. */
    .board { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
    #toast { left: 0; top: 0; transform: none; width: calc(100% - 44px); max-width: none; max-height: 44px; overflow: auto; padding: 4px 8px; border-radius: 12px; font-size: 12px; line-height: 1.3; }
    #toast.on { pointer-events: auto; }
    #toast.replaying { cursor: pointer; }
    #toast.replaying::after { content: ' · 탭으로 건너뛰기'; font-size: 10px; }
    .tile.pop { outline: 3px solid #3a1c2b; outline-offset: -3px; }
    .tile.R { padding-bottom: 6px; }
    @media (prefers-reduced-motion: reduce) { .tile.pop { animation: none; } }
    /* 결과 화면에 덧붙인 번역 문항(game.js addFlowQuiz)도 공통 문항과 같은 모양으로 */
    .flow-opts { display: grid; gap: 6px; }
    .flow-fb { font-size: 14px !important; }
  </style>
</head>
<body>
  <header class="bar"><a href="../../index.html">← 오락실</a><b>염기쌍 팡</b><div class="hud"><span id="lvhud"></span></div></header>
  <main id="stage">
    <div class="top"><div class="scorebox" id="score">0</div><div class="movebox">남은 이동 <b id="moves"></b></div></div>
    <div class="legend-slot">
      <div class="legend" id="legend"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <div class="board">
      <div class="grid" id="grid" aria-label="염기 판"></div>
    </div>
  </main>
  <div class="overlay" id="overlay" hidden></div>
  <script src="../../shared/standards.js"></script>
  <script src="../../shared/arcade.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
